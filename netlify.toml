[build]
  command = "npm run build"
  publish = "dist/client"

# As funcoes de borda (netlify/edge-functions/) declaram sozinhas em quais
# enderecos rodam, no proprio arquivo. Repetir aqui faria cada uma rodar
# duas vezes por requisicao.
#
#   seo.ts      -> "/", "/vagas", "/denuncie", "/anuncie", "/noticia/*", "/categoria/*"
#   sitemap.ts  -> "/sitemap.xml", "/sitemap-noticias.xml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
